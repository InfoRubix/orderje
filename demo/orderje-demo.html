<title>OrderJe Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: dark app rail + work area; the customer view sits in a phone frame. Tickets borrow the thermal-receipt slip. */
:root {
  --ink: #1d2433; --ink-soft: #4b5468; --mute: #7b8496;
  --paper: #f5f6f8; --surface: #ffffff; --line: #e2e5eb;
  --pandan: #1f7a4d; --pandan-dark: #155c39; --pandan-soft: #e3f2ea;
  --teh: #a8681a; --teh-soft: #fbf0df; --chili: #c23a2f; --chili-soft: #fbe7e5;
  --slip: #fffdf7; --rail: #1d2433; --rail-fg: #ffffff; --on-accent: #ffffff;
  --shadow: rgb(29 36 51 / .35);
  --display: "Bricolage Grotesque", "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #e8ebf1; --ink-soft: #b3bacb; --mute: #8a93a6;
  --paper: #12161f; --surface: #1a1f2b; --line: #2b3242;
  --pandan: #2f9a65; --pandan-dark: #6fd3a0; --pandan-soft: #173528;
  --teh: #e2a552; --teh-soft: #3a2c17; --chili: #ef6b5f; --chili-soft: #3d1e1c;
  --slip: #222837; --rail: #0c0f15; --rail-fg: #e8ebf1; --shadow: rgb(0 0 0 / .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --ink: #e8ebf1; --ink-soft: #b3bacb; --mute: #8a93a6;
  --paper: #12161f; --surface: #1a1f2b; --line: #2b3242;
  --pandan: #2f9a65; --pandan-dark: #6fd3a0; --pandan-soft: #173528;
  --teh: #e2a552; --teh-soft: #3a2c17; --chili: #ef6b5f; --chili-soft: #3d1e1c;
  --slip: #222837; --rail: #0c0f15; --rail-fg: #e8ebf1; --shadow: rgb(0 0 0 / .6); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased }
h1, h2, h3, .disp { font-family: var(--display); letter-spacing: -.01em; text-wrap: balance; margin: 0 }
button { font: inherit; color: inherit; cursor: pointer }
input, select, textarea { font: inherit; color: var(--ink) }
.num { font-variant-numeric: tabular-nums }
:focus-visible { outline: 2px solid var(--pandan); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100% }
.rail { background: var(--rail); color: var(--rail-fg); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh }
.rail .brand { font: 700 22px var(--display); padding: 0 10px }
.rail .shop { font-size: 13px; opacity: .6; padding: 0 10px 18px }
.rail .group { font-size: 12px; opacity: .45; padding: 14px 10px 4px }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none; color: inherit; opacity: .75; text-align: left; width: 100% }
.nav:hover { opacity: 1; background: rgb(255 255 255 / .08) }
.nav.on { opacity: 1; background: rgb(255 255 255 / .14); font-weight: 600 }
.nav .dot { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; background: var(--teh); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px }
.rail .foot { margin-top: auto; font-size: 13px; opacity: .7; padding: 12px 10px 0; border-top: 1px solid rgb(255 255 255 / .1) }
.rail .foot button { background: none; border: 0; padding: 0; text-decoration: underline; opacity: .9; margin-top: 6px }
main { min-width: 0; padding-block: 28px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1180px; margin: 0 auto }
.mbar { display: none }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr }
  .rail { display: none }
  .mbar { display: flex; position: fixed; inset: auto 0 0 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto; gap: 2px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
  .mbar button { flex: 0 0 auto; border: 0; background: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); position: relative }
  .mbar button.on { background: var(--pandan-soft); color: var(--pandan-dark) }
  .mbar .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 4px; background: var(--teh) }
}

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px }
.head h1 { font-size: clamp(26px, 3vw, 32px); font-weight: 700 }
.head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px }
.pad { padding: 18px 20px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 9px; border: 1px solid transparent; font-weight: 600; font-size: 14px; background: var(--pandan); color: var(--on-accent) }
.btn:hover { filter: brightness(.95) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line) }
.btn.ghost { background: none; color: var(--ink-soft) }
.btn.dark { background: var(--ink); color: var(--paper) }
.btn.lg { height: 48px; font-size: 15px; padding: 0 20px }
.btn.xl { height: 56px; font-size: 17px; width: 100% }
.btn.danger-text { color: var(--chili) }
.field { width: 100%; height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 12px }
.field:focus { outline: none; border-color: var(--pandan); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pandan) 20%, transparent) }
textarea.field { height: 70px; padding: 10px 12px; resize: vertical }
.badge { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--ink-soft); white-space: nowrap }
.badge.green { background: var(--pandan-soft); color: var(--pandan-dark) }
.badge.amber { background: var(--teh-soft); color: var(--teh) }
.badge.red { background: var(--chili-soft); color: var(--chili) }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--paper); border-radius: 10px; padding: 4px; border: 1px solid var(--line) }
.seg button { border: 0; background: none; border-radius: 7px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--ink-soft) }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12) }
.seg button:disabled { opacity: .35; cursor: not-allowed }
.row { display: flex; justify-content: space-between; gap: 12px }
.muted { color: var(--ink-soft) }
.small { font-size: 13px }
.err { background: var(--chili-soft); color: var(--chili); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 500 }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-soft); background: color-mix(in srgb, var(--surface) 60%, transparent) }
.empty b { display: block; font: 600 17px var(--display); color: var(--ink); margin-bottom: 4px }

.slip { background: var(--slip); position: relative; border-radius: 10px 10px 0 0; box-shadow: 0 1px 0 var(--line), 0 8px 16px -12px var(--shadow) }
.slip::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px;
  background: linear-gradient(-45deg, transparent 6px, var(--slip) 0) 0 0 / 12px 8px repeat-x, linear-gradient(45deg, transparent 6px, var(--slip) 0) 0 0 / 12px 8px repeat-x }
.dash { border-top: 1px dashed var(--line) }
@keyframes arrive { from { background-color: var(--teh-soft) } to { background-color: var(--slip) } }
.arrive { animation: arrive 2.5s ease-out }

/* customer phone */
.phone-stage { display: grid; grid-template-columns: minmax(0, 390px) minmax(0, 1fr); gap: 32px; align-items: start }
.phone { background: var(--paper); border: 10px solid var(--ink); border-radius: 38px; overflow: hidden; height: min(780px, calc(100vh - 140px)); min-height: 560px; display: flex; flex-direction: column; position: relative; max-width: 100% }
.phone-scroll { overflow-y: auto; flex: 1; position: relative }
.phone .hero { background: var(--pandan); color: #fff; padding: 22px 20px 20px }
.phone .hero small { opacity: .8; font-size: 13px }
.phone .hero h2 { font-size: 28px; font-weight: 700; line-height: 1.1 }
.chips { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: color-mix(in srgb, var(--paper) 94%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px) }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--ink-soft) }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.mlist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden }
.mlist li + li { border-top: 1px solid var(--line) }
.mitem { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 16px; border: 0; background: none; text-align: left }
.mitem:disabled { opacity: .45 }
.plus { width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--pandan); font-size: 20px; flex: 0 0 auto }
.plus.filled { background: var(--pandan); border-color: var(--pandan); color: #fff; font-size: 14px; font-weight: 700 }
.price { color: var(--pandan-dark); font-weight: 600; font-size: 14px }
.cartbar { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 54px; border-radius: 12px; background: var(--ink); color: var(--paper); border: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-weight: 600; box-shadow: 0 10px 24px -8px var(--shadow); z-index: 5 }
.sheet-wrap { position: absolute; inset: 0; z-index: 10; display: flex; align-items: flex-end }
.sheet-wrap .scrim { position: absolute; inset: 0; background: rgb(15 18 25 / .5); border: 0 }
.sheet { position: relative; background: var(--surface); width: 100%; max-height: 88%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column }
.sheet header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line) }
.sheet header h3 { font-size: 20px }
.sheet .body { overflow-y: auto; padding: 16px 20px; display: grid; gap: 16px }
.sheet footer { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 10px; align-items: center }
.x { border: 0; background: none; font-size: 22px; color: var(--ink-soft); line-height: 1; padding: 4px 8px }
.opts { border: 1px solid var(--line); border-radius: 10px }
.opts label { display: flex; align-items: center; gap: 10px; padding: 11px 12px; cursor: pointer }
.opts label + label { border-top: 1px solid var(--line) }
.opts input { width: 18px; height: 18px; accent-color: var(--pandan) }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px }
.stepper button { width: 38px; height: 38px; border: 0; background: none; font-size: 18px; color: var(--ink-soft) }
.stepper span { width: 22px; text-align: center; font-weight: 700 }
.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0; text-align: center }
.progress .ic { width: 44px; height: 44px; border-radius: 22px; margin: 0 auto; display: grid; place-items: center; background: var(--line); color: var(--mute); font-weight: 700 }
.progress .on .ic { background: var(--pandan); color: #fff }
.progress .cur .ic { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pandan) 22%, transparent) }
.progress span { display: block; font-size: 12px; font-weight: 600; margin-top: 6px; color: var(--mute) }
.progress .on span { color: var(--ink) }
.note-panel { display: grid; gap: 12px }
.note-panel h2 { font-size: 22px }
.note-panel ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-soft) }
.fakeqr { width: 180px; height: 180px; margin: 10px auto; border-radius: 10px; background:
  conic-gradient(from 90deg at 18% 18%, var(--ink) 25%, transparent 0) 0 0 / 36px 36px, var(--surface); border: 8px solid var(--surface); outline: 1px solid var(--line) }

/* kitchen */
.kgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px }
.kcol h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; margin-bottom: 12px }
.count { background: var(--ink); color: var(--paper); border-radius: 6px; padding: 0 8px; font-size: 13px; font-family: var(--body) }
.ticket { padding: 12px 16px 16px; margin-bottom: 22px }
.ticket ul { list-style: none; margin: 0; padding: 10px 0; display: grid; gap: 6px }
.ticket li { display: flex; gap: 8px }
.ticket .q { font-weight: 700; font-size: 18px; width: 30px; flex: 0 0 auto }
.ticket .n { font-weight: 600; font-size: 17px; line-height: 1.3 }
.age-ok { color: var(--ink-soft) } .age-warn { color: var(--teh) } .age-late { color: var(--chili) }

/* counter */
.bills { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.bill { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: grid; gap: 4px }
.bill:hover { border-color: var(--pandan) }
.bill .t { font: 700 18px var(--display) }
.bill .amt { font-size: 24px; font-weight: 700; margin-top: 8px }
.pending { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1px solid color-mix(in srgb, var(--teh) 45%, transparent); background: color-mix(in srgb, var(--teh-soft) 70%, transparent); border-radius: 12px; padding: 12px 14px }
.pending .who { flex: 1; min-width: 150px }
.paygrid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start }
.lines { list-style: none; margin: 0; padding: 0 }
.lines li { display: flex; gap: 12px; padding: 10px 0 }
.lines li + li { border-top: 1px solid var(--line) }
.totals { display: grid; gap: 4px; padding: 12px 0; border-block: 1px solid var(--line); font-size: 14px }
.totals .row { color: var(--ink-soft) }
.totals .grand { color: var(--ink); font-size: 20px; font-weight: 700; padding-top: 4px }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.quick button { height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; font-weight: 600 }
.quick button:hover { border-color: var(--pandan) }
.change { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 14px 16px }
.change b { display: block; font: 700 36px var(--display) }
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.tile { min-height: 92px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between }
.tile:hover { border-color: var(--pandan) }
.tile:disabled { opacity: .4 }

/* modal */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px }
.modal .scrim { position: absolute; inset: 0; background: rgb(15 18 25 / .55); border: 0 }
.modal .box { position: relative; background: var(--surface); border-radius: 16px; width: min(440px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px }
.receipt { font: 12px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; padding: 18px 18px 22px; width: min(300px, 100%); margin: 0 auto }
.receipt .rule { border-top: 1px dashed var(--mute); margin: 10px 0 }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 22px }
.kpi { background: var(--surface); padding: 18px 20px }
.kpi.lead { background: var(--pandan); color: #fff }
.kpi .lab { font-size: 13px; opacity: .75 }
.kpi .val { font: 700 30px var(--display); margin-top: 2px }
.kpi .sub { font-size: 13px; opacity: .7; margin-top: 2px }
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px }
.dgrid .wide { grid-column: 1 / -1 }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 150px; border-bottom: 1px solid var(--line); position: relative; background: linear-gradient(to bottom, transparent calc(50% - 1px), var(--line) 50%, transparent calc(50% + 1px)) }
.bars .b { flex: 1; display: flex; align-items: flex-end; height: 100%; border: 0; background: none; padding: 0; position: relative }
.bars .b span { display: block; width: 100%; background: var(--pandan); border-radius: 4px 4px 0 0; min-height: 0 }
.bars .b:hover span, .bars .b:focus span { background: var(--pandan-dark) }
.bars .b .tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; display: none; pointer-events: none; z-index: 3; height: auto; width: auto; border-radius: 8px }
.bars .b:hover .tip, .bars .b:focus .tip { display: block }
.bars .b:nth-last-child(-n+3) .tip { left: auto; right: 0; transform: none }
.bars .b:nth-child(-n+3) .tip { left: 0; transform: none }
.axis { display: flex; gap: 3px; font-size: 11px; color: var(--mute); margin-top: 4px }
.axis span { flex: 1; text-align: center }
.share { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0 }
.share .track { height: 8px; background: var(--line); border-radius: 4px; margin-top: 4px }
.share .fill { height: 8px; background: var(--pandan); border-radius: 4px }
.rangebar { display: flex; flex-wrap: wrap; gap: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px }
.rangebar button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--ink-soft) }
.rangebar button.on { background: var(--ink); color: var(--paper) }

/* recon */
.rgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font-weight: 500; color: var(--ink-soft); padding: 10px 18px; border-bottom: 1px solid var(--line) }
td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
.r { text-align: right }
.over { color: var(--teh); font-weight: 600 } .short { color: var(--chili); font-weight: 600 } .match { color: var(--pandan-dark); font-weight: 600 }
.form { display: grid; gap: 12px }
.form label > span { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px }
.form label small { display: block; color: var(--mute); font-size: 12px; margin-top: 4px }
.tick { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 14px }
.tick input { width: 17px; height: 17px; accent-color: var(--pandan) }

/* menu & tables */
.switch { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700 }
.switch.on { background: var(--pandan-soft); color: var(--pandan-dark) }
.switch.off { background: var(--chili-soft); color: var(--chili) }
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px }
.qrcard { text-align: center; padding: 16px }
.qrbox { width: 150px; height: 150px; margin: 10px auto; background: #fff; padding: 8px; border-radius: 8px; display: grid; place-items: center }
.qrbox img, .qrbox canvas { width: 134px !important; height: 134px !important }

.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; background: var(--paper) }
.thumb.sm { width: 44px; height: 44px; border-radius: 8px }
.hero-photo { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; background: var(--paper); max-width: 100% }
.tile .tthumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; margin-bottom: 8px; max-width: 100% }
.logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #fff; flex: 0 0 auto; box-shadow: 0 0 0 2px rgb(255 255 255 / .5) }
.logo-ph { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font: 700 22px var(--display); background: rgb(255 255 255 / .2); color: var(--on-brand, #fff); flex: 0 0 auto }
.phone .hero { background: var(--brand, var(--pandan)); color: var(--on-brand, #fff) }
.cms { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start }
.cms-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px }
.cms-item + .cms-item { border-top: 1px solid var(--line) }
.cms-cat { display: flex; align-items: center; gap: 6px; padding: 10px 16px; background: var(--paper); border-bottom: 1px solid var(--line) }
.iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink-soft); display: inline-grid; place-items: center; font-size: 15px }
.iconbtn:hover { background: var(--paper); border-color: var(--line); color: var(--ink) }
.iconbtn:disabled { opacity: .3; cursor: not-allowed }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.sw { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line) }
.sw.on { box-shadow: 0 0 0 2px var(--ink) }
.colorpick { width: 44px; height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--surface) }
.drop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap }
.drop .preview { width: 96px; height: 96px; border-radius: 14px; object-fit: cover; border: 1px solid var(--line); background: var(--paper) }
.upload { position: relative; overflow: hidden }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
.grp { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px }
.grp .optrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 32px; gap: 6px }
.lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px }
.hint { display: block; color: var(--mute); font-size: 12px; margin-top: 4px }
.preview-phone { border: 6px solid var(--ink); border-radius: 26px; overflow: hidden; background: var(--paper) }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 10px; font-weight: 600; z-index: 60; box-shadow: 0 10px 24px -8px var(--shadow) }

@media (max-width: 1080px) {
  .phone-stage, .paygrid, .builder, .rgrid, .cms { grid-template-columns: minmax(0, 1fr) }
  .note-panel { order: -1 }
  .kgrid { grid-template-columns: 1fr }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .dgrid { grid-template-columns: 1fr }
}
@media (max-width: 860px) { .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)) } main { padding-block: 20px 110px } .phone { border-width: 6px; border-radius: 28px } }
@media (max-width: 480px) { .note-panel { order: 0 } .phone { height: calc(100vh - 150px); min-height: 520px } th, td { padding: 10px 12px } .tick { padding: 10px 12px; gap: 8px; flex-wrap: wrap } .kpis { grid-template-columns: 1fr } .phone { border: 0; border-radius: 14px; height: 640px } }
</style>

  function vDashboard() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const from = dash === "today" ? start.getTime() : dash === "yesterday" ? start.getTime() - 864e5 : start.getTime() - 6 * 864e5;
    const to = dash === "yesterday" ? start.getTime() : Infinity;
    const paid = S.orders.filter(o => (o.pay === "paid" || o.pay === "credit") && o.paidAt >= from && o.paidAt < to);
    const sales = paid.reduce((s, o) => s + o.total, 0);
    const pays = paid.map(o => o.payments.find(p => p.status !== "failed")).filter(Boolean);
    const by = (keyFn, keys) => keys.map(([k, label]) => { const os = paid.filter(o => keyFn(o) === k); return { label, n: os.length, v: os.reduce((s, o) => s + o.total, 0) }; });
    const byMethod = by(o => o.payments.find(p => p.status !== "failed").method, Object.entries(PM));

    const hours = Array.from({ length: 18 }, (_, i) => { const h = 6 + i; const os = paid.filter(o => new Date(o.paidAt).getHours() === h); return { h, v: os.reduce((s, o) => s + o.total, 0), n: os.length }; });
    const max = Math.max(1000, ...hours.map(h => h.v)); const nice = [1000, 2000, 5000, 10000, 20000, 50000, 100000].find(n => n >= max) || max;
    const lab = h => h === 12 ? "12p" : h > 12 ? (h - 12) + "p" : h + "a";
    const items = {}; paid.forEach(o => o.items.forEach(l => { items[l.name] = items[l.name] || { q: 0, v: 0 }; items[l.name].q += l.qty; items[l.name].v += l.unit * l.qty; }));
    const top = Object.entries(items).sort((a, b) => b[1].q - a[1].q).slice(0, 6);
    const open = S.orders.filter(o => (o.pay === "unpaid" || o.pay === "pending") && o.status !== "cancelled").length;
    const share = rows => `<ul class="share">${rows.map(r => `<li><div class="row small"><span style="font-weight:500">${r.label} <span class="num" style="color:var(--mute)">· ${r.n}</span></span><span class="num" style="font-weight:600">${rm(r.v)} <span style="color:var(--mute);font-weight:400">${sales ? Math.round(r.v / sales * 100) : 0}%</span></span></div><div class="track"><div class="fill" style="width:${sales ? Math.max(r.v / sales * 100, r.v ? 1.5 : 0) : 0}%"></div></div></li>`).join("")}</ul>`;
    return `${head(esc(B().name), dash === "today" ? "Today so far" : dash === "yesterday" ? "Yesterday" : "Last 7 days", `<div class="rangebar">${[["today", "Today"], ["yesterday", "Yesterday"], ["7d", "7 days"]].map(([k, v]) => `<button type="button" class="${dash === k ? "on" : ""}" data-range="${k}">${v}</button>`).join("")}</div>`)}

  /* ---------------- recon ---------------- */
  let reconForm = { float: "100", cash: "", qr: "", online: "", notes: "" };
  function reconExpected() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const paid = S.orders.filter(o => (o.pay === "paid" || o.pay === "credit") && o.paidAt >= start.getTime());
    const sum = m => paid.filter(o => o.payments.find(p => p.status !== "failed").method === m).reduce((s, o) => s + o.total, 0);
    const cnt = m => paid.filter(o => o.payments.find(p => p.status !== "failed").method === m).length;
    return { cash: sum("cash"), qr: sum("qr"), online: sum("online"), credit: sum("credit"), n: { cash: cnt("cash"), qr: cnt("qr"), online: cnt("online"), credit: cnt("credit") }, list: paid.filter(o => ["qr", "online"].includes(o.payments.find(p => p.status !== "failed").method)) };
  }
  const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  function diffCell(d) { return d === null ? "" : d === 0 ? `<span class="match">Match</span>` : `<span class="${d < 0 ? "short" : "over"} num">${d > 0 ? "+" : ""}${rm(d)}</span>`; }
  function vRecon() {
    const e = reconExpected(), c = S.closed, f = reconForm;
    const open = S.orders.filter(o => (o.pay === "unpaid" || o.pay === "pending") && o.status !== "cancelled");
    const actual = c ? { cash: c.cash - c.float, qr: c.qr, online: c.online } : null;
    const live = k => { if (f[k] === "") return null; const v = toSen(f[k]); if (!Number.isFinite(v)) return null; return k === "cash" ? v - toSen(f.float || 0) - e.cash : v - e[k]; };
    const liveLine = k => { const d = live(k); return d === null ? "" : `<div class="small ${d < 0 ? "short" : d > 0 ? "over" : "match"} num" id="live-${k}">${d === 0 ? "Matches" : d < 0 ? "Short " + rm(-d) : "Over " + rm(d)}</div>`; };
    return `${head("End-of-day recon", "Check what the system recorded against your cash drawer and bank app.")}
      <div class="rgrid"><div style="display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0"><div class="card" style="overflow-x:auto"><div class="row" style="padding:14px 18px;border-bottom:1px solid var(--line);align-items:center"><h2 style="font-size:18px">Today</h2>${c ? '<span class="badge green">Closed</span>' : '<span class="badge amber">Open</span>'}</div>
        <table><thead><tr><th>Channel</th><th class="r">System</th><th class="r">${c ? "Actual" : "Count"}</th><th class="r">${c ? "Difference" : ""}</th></tr></thead><tbody class="num">
        ${[["cash", "Cash", pl(e.n.cash, "bill")], ["qr", "DuitNow QR", pl(e.n.qr, "payment")]].map(([k, n, s]) => `<tr><td><b>${n}</b><div class="small" style="color:var(--mute)">${s}</div></td><td class="r"><b>${rm(e[k])}</b></td><td class="r">${actual ? rm(actual[k]) + (k === "cash" ? `<div class="small" style="color:var(--mute)">drawer ${rm(c.cash)} − float ${rm(c.float)}</div>` : "") : '<span style="color:var(--mute)">—</span>'}</td><td class="r">${actual ? diffCell(actual[k] - e[k]) : ""}</td></tr>`).join("")}
        <tr class="muted"><td>Corporate credit<div class="small" style="color:var(--mute)">${pl(e.n.credit, "bill")}, collected later</div></td><td class="r">${rm(e.credit)}</td><td colspan="2" class="r small">Not counted in today's money</td></tr></tbody></table>
        ${c ? `<div class="small muted" style="padding:12px 18px;border-top:1px solid var(--line)">Closed ${fmtT(c.at)} by Ali${c.notes ? `<div style="color:var(--ink)">Note: ${esc(c.notes)}</div>` : ""}</div>` : ""}</div>
        <div class="card"><div style="padding:14px 18px"><h2 style="font-size:18px">DuitNow QR payments to tick off</h2><div class="small muted">Match each one against your bank app.</div></div>
        ${e.list.map(o => { const p = o.payments.find(p => p.status !== "failed"); return `<label class="tick"><input type="checkbox"><span class="num muted" style="width:70px">${fmtT(o.paidAt)}</span><b style="width:40px">QR</b><span class="muted" style="flex:1">Order #${o.no}</span><span class="num muted">${esc(p.ref || "no ref")}</span><b class="num" style="width:80px;text-align:right">${rm(o.total)}</b></label>`; }).join("") || '<div class="small muted" style="padding:0 18px 16px">No QR or online payments today.</div>'}</div></div>
      <div style="display:grid;gap:20px">${c ? `<div class="card pad" style="display:grid;gap:10px"><h2 style="font-size:18px">This day is closed</h2><div class="small muted">To fix a mistake, the owner reopens the day, corrects the orders, and closes again. Payments are blocked while it's closed.</div><button type="button" class="btn sec" data-reopen>Reopen day</button></div>`
        : open.length ? `<div class="card pad" style="display:grid;gap:10px;background:var(--teh-soft);border-color:transparent"><h2 style="font-size:18px;color:var(--teh)">Can't close yet</h2><div class="small">${pl(open.length, "order")} ${open.length === 1 ? "is" : "are"} unpaid or waiting for payment confirmation (${open.map(o => "#" + o.no).join(", ")}). Settle or cancel ${open.length === 1 ? "it" : "them"} first.</div><button type="button" class="btn" style="background:var(--teh)" data-go="counter">Open counter</button><button type="button" class="btn ghost small" data-settleall>Settle them all as cash (demo shortcut)</button></div>`
        : `<form class="card pad form" id="closeform"><h2 style="font-size:18px">Close today</h2><div class="small muted" style="margin-top:-6px">Count the drawer and check your bank app, then enter what you see.</div>
          <label><span>Opening float (RM)</span><input class="field num" inputmode="decimal" data-rf="float" value="${esc(f.float)}"><small>Cash in the drawer before the first sale</small></label>
          <label><span>Cash counted in drawer (RM)</span><input class="field num" inputmode="decimal" data-rf="cash" value="${esc(f.cash)}" placeholder="${((e.cash + toSen(f.float || 0)) / 100).toFixed(2)}"><small>System expects ${rm(e.cash)} + float</small></label>${liveLine("cash")}
          <label><span>DuitNow QR received in bank (RM)</span><input class="field num" inputmode="decimal" data-rf="qr" value="${esc(f.qr)}"><small>System expects ${rm(e.qr)}</small></label>${liveLine("qr")}
          <label><span>Notes</span><textarea class="field" data-rf="notes" placeholder="Explain any difference">${esc(f.notes)}</textarea></label>
          <div class="err" id="rerr" hidden></div><button type="submit" class="btn lg">Close today</button></form>`}</div></div>`;
  }

          <div class="swatches">${PRESETS.map(([n, c]) => `<button type="button" class="sw ${b.color.toLowerCase() === c ? "on" : ""}" style="background:${c}" data-color="${c}" aria-label="${n}" title="${n}"></button>`).join("")}

            ${d.groups.map((g, gi) => `<div class="grp"><div style="display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;gap:8px;align-items:center"><input class="field" data-gname="${gi}" value="${esc(g.name)}" placeholder="Group, e.g. Panas / Ais" aria-label="Group name">
              <label class="small" style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" data-greq="${gi}" ${g.req ? "checked" : ""} style="accent-color:var(--pandan)"> Required</label>
              <label class="small" style="display:flex;gap:6px;align-items:center;white-space:nowrap">Max <input class="field num" data-gmax="${gi}" value="${g.max}" style="width:52px;height:34px;padding:0 8px" inputmode="numeric"></label>
              <button type="button" class="iconbtn" data-gdel="${gi}" aria-label="Remove group">×</button></div>
              ${g.opts.map(([n, p], oi) => `<div class="optrow"><input class="field" style="height:36px" data-oname="${gi}:${oi}" value="${esc(n)}" placeholder="Option, e.g. Ais" aria-label="Option name"><input class="field num" style="height:36px" data-oprice="${gi}:${oi}" value="${esc(p)}" placeholder="+RM 0.00" inputmode="decimal" aria-label="Extra price"><button type="button" class="iconbtn" data-odel="${gi}:${oi}" aria-label="Remove option">×</button></div>`).join("")}
              <button type="button" class="btn ghost" style="height:30px;padding:0;justify-self:start;color:var(--pandan-dark)" data-oadd="${gi}">+ Option</button></div>`).join("")}
            <button type="button" class="btn sec" style="justify-self:start" data-gadd>+ Add-on group</button></div></div>
          ${err ? `<div class="err">${esc(err)}</div>` : ""}
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px">
            <button type="button" class="btn lg" data-save>${isNew ? "Add to menu" : "Save changes"}</button><button type="button" class="btn ghost lg" data-x>Cancel</button>
            ${isNew ? "" : askDel ? `<span style="margin-left:auto;display:flex;gap:6px;align-items:center" class="small">Delete for good? <button type="button" class="btn" style="background:var(--chili);height:34px" data-delyes>Delete</button><button type="button" class="btn ghost" style="height:34px" data-delno>No</button></span>` : `<button type="button" class="btn ghost danger-text" style="margin-left:auto" data-del>Delete item</button>`}</div>
        </div></div></div>`);
      const el = document.getElementById("ieditor");
      const sync = () => {
        d.name = el.querySelector("#e-name").value; d.priceTxt = el.querySelector("#e-price").value; d.desc = el.querySelector("#e-desc").value;
        d.cat = +el.querySelector("#e-cat").value; d.out = el.querySelector("#e-out").checked;
        el.querySelectorAll("[data-gname]").forEach(i => d.groups[+i.dataset.gname].name = i.value);
        el.querySelectorAll("[data-greq]").forEach(i => d.groups[+i.dataset.greq].req = i.checked);
        el.querySelectorAll("[data-gmax]").forEach(i => d.groups[+i.dataset.gmax].max = i.value);
        el.querySelectorAll("[data-oname]").forEach(i => { const [g, o] = i.dataset.oname.split(":").map(Number); d.groups[g].opts[o][0] = i.value; });
        el.querySelectorAll("[data-oprice]").forEach(i => { const [g, o] = i.dataset.oprice.split(":").map(Number); d.groups[g].opts[o][1] = i.value; });
      };
      const on = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = () => { sync(); fn(b); });
      on("[data-x]", () => el.remove());
      on("[data-gadd]", () => { d.groups.push({ name: "", req: false, max: 1, opts: [["", ""]] }); draw(); });
      on("[data-gdel]", b => { d.groups.splice(+b.dataset.gdel, 1); draw(); });
      on("[data-oadd]", b => { d.groups[+b.dataset.oadd].opts.push(["", ""]); draw(); });
      on("[data-odel]", b => { const [g, o] = b.dataset.odel.split(":").map(Number); d.groups[g].opts.splice(o, 1); draw(); });
      on("[data-rmimg]", () => { d.img = null; draw(); });
      on("[data-del]", () => { askDel = true; draw(); });
      on("[data-delno]", () => { askDel = false; draw(); });
      on("[data-delyes]", () => { CMS.menu[ci].items.splice(ii, 1); saveCms(); el.remove(); cart = cart.filter(l => l.id !== src.id); render(); toast(`${src.name} deleted`); });
      el.querySelector("#itemFile").onchange = e => { sync(); readPhoto(e.target.files[0], 640, url => { d.img = url; err = ""; draw(); }, m => { err = m; draw(); }); };
      on("[data-save]", () => {
        const price = toSen(d.priceTxt);
        if (!d.name.trim()) { err = "Give the item a name."; return draw(); }
        if (!Number.isFinite(price) || price <= 0) { err = "Enter a price, e.g. 8.50."; return draw(); }
        const groups = [];
        for (const g of d.groups) {
          const opts = g.opts.filter(([n]) => n.trim());
          if (!g.name.trim() && !opts.length) continue;
          if (!g.name.trim()) { err = "Every add-on group needs a name."; return draw(); }
          if (!opts.length) { err = `Add at least one option to ${g.name}.`; return draw(); }
          const priced = opts.map(([n, p]) => [n.trim(), p === "" ? 0 : toSen(p)]);
          if (priced.some(([, p]) => !Number.isFinite(p) || p < 0)) { err = `Check the extra prices in ${g.name}.`; return draw(); }
          const max = Math.max(1, Math.min(priced.length, parseInt(g.max, 10) || 1));
          groups.push({ name: g.name.trim(), req: !!g.req, max, opts: priced });
        }
        const saved = { id: src.id, kind: src.kind, name: d.name.trim(), price, desc: d.desc.trim(), img: d.img, groups, out: d.out };
        if (isNew) CMS.menu[d.cat].items.push(saved);
        else if (d.cat === ci) CMS.menu[ci].items[ii] = saved;
        else { CMS.menu[ci].items.splice(ii, 1); CMS.menu[d.cat].items.push(saved); }
        saveCms(); el.remove(); render(); toast(isNew ? `${saved.name} added to the menu` : `${saved.name} saved`);
        if (saveFailed) toast("Saved for now. This browser won't keep it after a reload.");
      });
      setTimeout(() => el.querySelector(isNew ? "#e-name" : ".box")?.focus?.(), 0);
    };
    draw();
  }
  function vTables() {
    return `${head("Tables & QR", "Print and stick one QR on each table. Orders arrive tagged with the table name.", `<button type="button" class="btn sec" data-demo-note>Print QR codes</button>`)}
      <div class="qrgrid">${["Takeaway", ...TABLES].map(t => `<div class="card qrcard" style="border-top:4px solid ${esc(B().color)}"><div class="small muted">${esc(B().name)}</div><div class="disp" style="font-size:20px;font-weight:700">${t}</div><div class="qrbox" data-qrtext="https://orderje.my/t/ayam-gepuk-netizen/${t === "Takeaway" ? "takeaway" : t.replace(" ", "-").toLowerCase()}"></div><div class="small" style="font-weight:600">${t === "Takeaway" ? "Scan to order bungkus" : "Scan to order & pay"}</div>${t !== "Takeaway" ? `<button type="button" class="btn ghost small" style="margin-top:6px" data-tryqr="${t}">Open as customer</button>` : `<button type="button" class="btn ghost small" style="margin-top:6px" data-tryqr="Takeaway">Open as customer</button>`}</div>`).join("")}</div>`;
  }
  function drawQrs() {
    document.querySelectorAll("[data-qrtext]").forEach(el => {
      try { if (window.QRCode) new QRCode(el, { text: el.dataset.qrtext, width: 134, height: 134, colorDark: "#1d2433", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); else el.innerHTML = '<div class="fakeqr" style="width:134px;height:134px;margin:0;border:0"></div>'; } catch { }
    });
  }

  /* ---------------- events ---------------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-go]"); if (!t) return;
    const d = t.dataset;
    if (d.go) { if (d.go === "neworder") { counterCart = []; payState = {}; } return go(d.go); }
    if (d.cat !== undefined) { custScreen.activeCat = +d.cat; const sec = document.getElementById("pcat-" + d.cat), sc = document.getElementById("pscroll"); if (sec && sc) sc.scrollTo({ top: sec.offsetTop - 60, behavior: "smooth" }); document.querySelectorAll("[data-cat]").forEach(c => c.classList.toggle("on", c === t)); return; }
    if (d.pick) { const it = item(d.pick); phoneScroll = document.getElementById("pscroll")?.scrollTop || 0; return itemSheet(it, l => { cart.push(l); render(); toast(`${l.qty} × ${l.name} added`); }, true); }
    if (d.openCart !== undefined) { phoneScroll = document.getElementById("pscroll")?.scrollTop || 0; return cartSheet(); }
    if (d.qr) { custScreen = { page: "menu", token: null, otype: d.qr === "Takeaway" ? "takeaway" : "dine_in", table: d.qr === "Takeaway" ? null : d.qr, activeCat: 0 }; cart = []; phoneScroll = 0; return render(); }
    if (d.tryqr) { custScreen = { page: "menu", token: null, otype: d.tryqr === "Takeaway" ? "takeaway" : "dine_in", table: d.tryqr === "Takeaway" ? null : d.tryqr, activeCat: 0 }; cart = []; phoneScroll = 0; return go("customer"); }
    if (d.newcust !== undefined) { custScreen.page = "menu"; custScreen.showQr = false; return render(); }
    if (d.showqr !== undefined) { custScreen.showQr = true; return render(); }
    if (d.fpx !== undefined) { const o = S.orders.find(x => x.token === custScreen.token); o.pay = "paid"; o.paidAt = now(); o.payments.push({ method: "online", amount: o.total, ref: "TP" + Math.floor(now() / 1000 % 1e6), status: "success" }); render(); return toast("FPX payment confirmed by ToyyibPay"); }
    if (d.declare !== undefined) { const o = S.orders.find(x => x.token === custScreen.token); o.pay = "pending"; o.payments.push({ method: "qr", amount: o.total, status: "pending", at: now() }); render(); return toast("Counter will confirm your payment"); }
    if (d.receipt) return receiptModal(S.orders.find(x => x.no === +d.receipt));
    if (d.move) { const o = S.orders.find(x => x.no === +d.move); o.status = d.to; render(); return toast(`#${o.no} ${d.to === "served" ? "served" : "moved to " + (d.to === "preparing" ? "Cooking" : d.to === "ready" ? "Ready" : "New")}`); }
    if (d.cancel) { const o = S.orders.find(x => x.no === +d.cancel); o.status = "cancelled"; o.payments.forEach(p => p.status === "pending" && (p.status = "failed")); if (o.pay === "pending") o.pay = "unpaid"; render(); return toast(`#${o.no} cancelled`); }
    if (d.fs !== undefined) { document.documentElement.requestFullscreen?.().catch(() => toast("Full screen isn't available here")); return; }
    if (d.confirm) { const o = S.orders.find(x => x.no === +d.confirm); const ref = document.getElementById("ref-" + o.no).value.trim(); const er = document.getElementById("perr-" + o.no); if (!ref) { er.textContent = "Enter the bank reference before confirming."; er.hidden = false; return; } if (S.closed) { er.textContent = "Today is already closed in Recon. Reopen it before taking more payments."; er.hidden = false; return; } const p = o.payments.find(p => p.status === "pending"); p.status = "success"; p.ref = ref; o.pay = "paid"; o.paidAt = now(); render(); return toast(`#${o.no} paid by DuitNow QR`); }
    if (d.reject) { const o = S.orders.find(x => x.no === +d.reject); o.payments.find(p => p.status === "pending").status = "failed"; o.pay = "unpaid"; render(); return toast(`#${o.no} back to unpaid`); }
    if (d.open) return openOrder(+d.open);
    if (d.ct) { payState.ctype = d.ct; payState.cust = d.ct === S.orders.find(x => x.no === S.cOrder).ctype ? S.orders.find(x => x.no === S.cOrder).cust : null; payState.err = ""; return render(); }
    if (d.apply !== undefined) { const o = S.orders.find(x => x.no === S.cOrder); o.ctype = payState.ctype; o.cust = payState.ctype === "walk_in" ? null : payState.cust; if (o.cust) o.name = CUSTOMERS.find(c => c.id === o.cust).name; Object.assign(o, totals(o.subtotal, o.ctype, o.type)); o.rounding = 0; payState.method = o.ctype === "corporate" ? "credit" : "cash"; render(); return toast(`${CT[o.ctype]} pricing applied`); }
    if (d.pm) { payState.method = d.pm; payState.err = ""; return render(); }
    if (d.tender) { payState.tendered = d.tender; return render(); }
    if (d.pay !== undefined) {
      const o = S.orders.find(x => x.no === S.cOrder);
      if (S.closed) { payState.err = "Today is already closed in Recon. Ask the owner to reopen it before taking more payments."; return render(); }
      if (payState.method === "cash") { const due = cashRound(o.total); const tend = payState.tendered ? toSen(payState.tendered) : due; if (!Number.isFinite(tend) || tend < due) { payState.err = "Cash received is less than the bill."; return render(); } o.rounding = due - o.total; o.total = due; o.payments.push({ method: "cash", amount: due, tendered: tend, change: tend - due, status: "success" }); o.pay = "paid"; }
      else if (payState.method === "qr") { const ref = document.getElementById("pref").value.trim(); if (!ref) { payState.err = "Enter the last digits of the bank reference to confirm the QR payment."; return render(); } o.payments.push({ method: "qr", amount: o.total, ref, status: "success" }); o.pay = "paid"; }
      else { const corp = CUSTOMERS.find(c => c.id === o.cust); const owing = S.orders.filter(x => x.pay === "credit" && x.cust === o.cust).reduce((s, x) => s + x.total, 0); if (owing + o.total > corp.limit) { payState.err = `${corp.company} would exceed their credit limit.`; return render(); } o.payments.push({ method: "credit", amount: o.total, status: "success" }); o.pay = "credit"; }
      o.paidAt = now(); render(); return toast(o.pay === "credit" ? "Charged to company account" : "Payment received");
    }
    if (d.askcancel) { const sp = document.getElementById("cconf"); sp.innerHTML = ` <span class="small muted">Cancel #${d.askcancel}? </span><button type="button" class="btn danger-text ghost" data-cancel="${d.askcancel}">Yes, cancel</button>`; return; }
    if (d.ncat !== undefined) { payState.ncat = +d.ncat; return render(); }
    if (d.ntype) { counterType = d.ntype; payState.nerr = ""; return render(); }
    if (d.ntile) { const it = item(d.ntile); const add = l => { const same = counterCart.find(x => x.id === l.id && x.mods === l.mods && x.note === l.note); if (same) same.qty += l.qty; else counterCart.push(l); render(); }; if (it.groups) itemSheet(it, add, false); else add({ id: it.id, name: it.name, mods: "", qty: 1, unit: it.price, note: "" }); return; }
    if (d.nq !== undefined) { const l = counterCart[+d.nq]; l.qty += +d.d; if (l.qty <= 0) counterCart.splice(+d.nq, 1); return render(); }
    if (d.nsend !== undefined) {
      if (counterType === "dine_in" && !counterTable) { payState.nerr = "Pick a table for dine-in, or switch to takeaway."; return render(); }
      const sub = counterCart.reduce((s, l) => s + l.unit * l.qty, 0);
      const o = { no: ++S.seq, src: "counter", type: counterType, table: counterType === "dine_in" ? counterTable : null, ctype: "walk_in", cust: null, name: payState.nname || "", status: "new", pay: "unpaid", payments: [], rounding: 0, createdAt: now(), items: counterCart.map(l => ({ ...l })), ...totals(sub, "walk_in", counterType) };
      S.orders.push(o); fresh.add(o.no); counterCart = []; toast(`Order #${o.no} sent to the kitchen`); return openOrder(o.no);
    }
    if (d.range) { dash = d.range; return render(); }
    if (d.sold) { const it = item(d.sold); it.out = !it.out; saveCms(); render(); return toast(`${it.name} ${it.out ? "marked sold out" : "available again"}`); }
    if (d.edit) { const [ci, ii] = d.edit.split(":").map(Number); return itemEditor(ci, ii); }
    if (d.additem !== undefined) { if (!CMS.menu.length) return; return itemEditor(+d.additem, null); }
    if (d.renamecat !== undefined) { renamingCat = +d.renamecat; delCatAsk = null; render(); document.getElementById("catname")?.focus(); return; }
    if (d.savecat !== undefined) { const v = document.getElementById("catname").value.trim(); if (!v) return toast("Category name can't be empty"); CMS.menu[+d.savecat].cat = v; renamingCat = null; saveCms(); render(); return toast("Category renamed"); }
    if (d.cancelcat !== undefined) { renamingCat = null; delCatAsk = null; return render(); }
    if (d.delcat !== undefined) { delCatAsk = +d.delcat; renamingCat = null; return render(); }
    if (d.delcatyes !== undefined) { const c = CMS.menu.splice(+d.delcatyes, 1)[0]; delCatAsk = null; const gone = new Set(c.items.map(i => i.id)); cart = cart.filter(l => !gone.has(l.id)); custScreen.activeCat = 0; saveCms(); render(); return toast(`${c.cat} deleted`); }
    if (d.catup !== undefined || d.catdown !== undefined) { const i = +(d.catup ?? d.catdown), j = d.catup !== undefined ? i - 1 : i + 1; [CMS.menu[i], CMS.menu[j]] = [CMS.menu[j], CMS.menu[i]]; saveCms(); return render(); }
    if (d.color) { B().color = d.color; saveCms(); return render(); }
    if (d.rmlogo !== undefined) { B().logo = null; saveCms(); render(); return toast("Logo removed"); }
    if (d.askrestore !== undefined) { document.getElementById("restoreConf").innerHTML = ` <span class="small">This replaces your logo, colour and menu edits. </span><button type="button" class="btn" style="height:32px;background:var(--chili)" data-restoreyes>Restore</button>`; return; }
    if (d.restoreyes !== undefined) { CMS = freshCms(); saveCms(); cart = []; render(); return toast("Sample brand and menu restored"); }
    if (d.reopen !== undefined) { S.closed = null; render(); return toast("Today reopened"); }
    if (d.settleall !== undefined) { S.orders.filter(o => (o.pay === "unpaid" || o.pay === "pending") && o.status !== "cancelled").forEach(o => { o.payments.forEach(p => p.status === "pending" && (p.status = "failed")); const due = cashRound(o.total); o.rounding = due - o.total; o.total = due; o.payments.push({ method: "cash", amount: due, tendered: due, change: 0, status: "success" }); o.pay = "paid"; o.paidAt = now(); if (o.status !== "served") o.status = "served"; }); render(); return toast("Open bills settled as cash"); }
    if (d.demoNote !== undefined) return toast("Works in the full app. This demo shows the screens only.");
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "tender") { payState.tendered = t.value; const o = S.orders.find(x => x.no === S.cOrder), due = cashRound(o.total), v = toSen(t.value); document.getElementById("changeLine").textContent = v >= due ? "Change " + rm(v - due) : ""; }
    if (t.id === "pref") payState.ref = t.value;
    if (t.dataset.brand) { B()[t.dataset.brand] = t.value; saveCms(); refreshBrandPreview(); }
    if (t.id === "b-color") { B().color = t.value; saveCms(); refreshBrandPreview(); document.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x.dataset.color === t.value.toLowerCase())); }
    if (t.id === "nname") payState.nname = t.value;
    if (t.dataset.rf) { reconForm[t.dataset.rf] = t.value; if (t.dataset.rf !== "notes") { const pos = t.selectionStart; render(); const el = document.querySelector(`[data-rf="${t.dataset.rf}"]`); el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
  });
  document.addEventListener("change", e => {
    if (e.target.id === "custsel") { payState.cust = e.target.value || null; render(); }
    if (e.target.id === "logoFile") { const er = document.getElementById("logoErr"); readPhoto(e.target.files[0], 256, url => { B().logo = url; saveCms(); render(); toast("Logo updated"); }, m => { er.textContent = m; er.hidden = false; }); }
    if (e.target.id === "ntable") { counterTable = e.target.value; payState.nerr = ""; }
  });
  document.addEventListener("submit", e => {
    if (e.target.id === "newcat") { e.preventDefault(); const v = document.getElementById("newcatname").value.trim(); if (!v) return toast("Type a category name first"); CMS.menu.push({ id: "c" + now().toString(36), cat: v, items: [] }); saveCms(); render(); return toast(`${v} added`); }
    if (e.target.id !== "closeform") return; e.preventDefault();
    const f = reconForm, er = document.getElementById("rerr");
    const vals = ["float", "cash", "qr"].map(k => toSen(f[k] === "" ? NaN : f[k]));
    if (vals.some(v => !Number.isFinite(v))) { er.textContent = "Fill in the float, cash counted and QR amounts."; er.hidden = false; return; }
    S.closed = { float: vals[0], cash: vals[1], qr: vals[2], notes: f.notes, at: now() };
    render(); toast("Today closed");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll("#ieditor, #rmodal, #isheet, #csheet").forEach(x => x.remove()); });
  document.getElementById("reset").onclick = () => { S = seed(); cart = []; counterCart = []; reconForm = { float: "100", cash: "", qr: "", online: "", notes: "" }; custScreen = { page: "menu", token: null, otype: "dine_in", table: "Meja 3", activeCat: 0 }; render(); toast("Demo reset"); };
  // Kitchen and counter refresh their timers every 30 s, like the real screens polling.
  setInterval(() => { if (["kitchen", "counter"].includes(S.view) && !document.querySelector(".modal, .sheet-wrap") && !document.activeElement?.matches("input, textarea, select")) render(); }, 30000);

  window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.some(x => x[0] === v) && v !== S.view) go(v); });
  const startView = (location.hash || "").slice(1);
  S.view = VIEWS.some(v => v[0] === startView) ? startView : "customer";
  render();
})();
</script>
