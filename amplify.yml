version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify only exposes env vars at build time; write the server-side ones
        # into .env.production so the Next.js server can read them at runtime.
        - env | grep -E '^(DATABASE_URL|AUTH_SECRET|APP_URL|SUPERADMIN_EMAILS|ALLOW_SIGNUP|DB_SSL|DB_POOL_SIZE)=' >> .env.production
        - npm run db:migrate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
